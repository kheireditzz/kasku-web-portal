name: Auto Redeploy & Keep-Alive Telegram Bot

on:
  schedule:
    # Berjalan setiap 6 jam untuk memastikan Webhook Telegram & Vercel selalu hidup & tak pernah hilang
    - cron: '5 */6 * * *'
  workflow_dispatch: # Memungkinkan memicu kapan saja secara manual dari GitHub

permissions:
  contents: write

jobs:
  keepalive-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bot Webhook Self-Healing
        run: |
          echo "Memeriksa dan meregistrasi webhook Telegram secara otomatis..."
          curl -s -f "https://kasku.kheireditz.my.id/api/bot?fix=1" || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Automatic Vercel Redeploy
        run: |
          git config user.name "KasKu AutoDeploy Bot"
          git config user.email "bot@kasku.kheireditz.my.id"
          git commit --allow-empty -m "chore(cloud): auto keepalive & redeploy [skip ci]"
          git push origin main || true
